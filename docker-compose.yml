# =============================================================================
# Umami — основной стек приложения (app + PostgreSQL)
# Все секреты и параметры берутся из .env (генерируется setup.sh).
# Отличия от upstream docker-compose.yml (см. отчёт, этап 1):
#   - образ приложения СОБИРАЕТСЯ локально из зафиксированного тега v3.2.0
#     (было: image: ghcr.io/...:latest)
#   - пароли/секреты вынесены в .env (было: хардкод в файле)
#   - для каждого сервиса добавлены mem_limit и cpus (Р4)
#   - healthcheck сохранён/уточнён для обоих сервисов
# =============================================================================

services:
  umami:
    build:
      # Контекст — каталог с исходниками umami, склонированными setup.sh на теге v3.2.0.
      context: ./umami-src
      dockerfile: Dockerfile
    image: umami-hardened:v3.2.0
    container_name: umami-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      APP_SECRET: "${APP_SECRET}"
      DISABLE_TELEMETRY: "1"
    depends_on:
      db:
        condition: service_healthy
    init: true
    # Ограничения ресурсов (Р4). Синтаксис Compose v2 (non-swarm).
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      TZ: "UTC"
      PGTZ: "UTC"
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    # Ограничения ресурсов (Р4)
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  umami-db-data:
