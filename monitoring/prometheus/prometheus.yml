global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Сам Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики хоста
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Метрики контейнеров (CPU/RAM/сеть по каждому сервису)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Метрики PostgreSQL + бизнес-метрики umami (custom queries)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Доступность и время ответа HTTP-эндпоинтов umami через blackbox
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://umami:3000/api/heartbeat
          - http://umami:3000/login
          - http://umami:3000/script.js
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
